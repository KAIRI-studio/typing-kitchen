<!doctype html>
<html lang="ja">
<head>
<link rel="icon" type="image/png" sizes="512x512" href="/castor-favicon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイピングキッチン | KAIRI_studio</title>
<style>
* { box-sizing: border-box; }
:root {
  color-scheme: light;
  --ink: #392622;
  --muted: #73554b;
  --paper: #fff8e8;
  --red: #b93229;
  --teal: #23645b;
  --line: #e8d3b4;
  --honey: #ffcd76;
}
body { margin: 0; color: var(--ink); background: #f5e6cc; font-family: "Yu Gothic UI", Meiryo, sans-serif; }
main { width: min(calc(100% - 40px), 1320px, max(700px, calc((100svh - 220px) * var(--scene-scale, 2.14)))); margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 58px; }
h1 { margin: 0; color: var(--red); font-size: clamp(15px, 2vw, 23px); font-weight: 900; }
.brand { color: var(--teal); font: 700 12px ui-monospace, monospace; letter-spacing: .12em; }
[hidden] { display: none !important; }
.scene { position: relative; isolation: isolate; }
#kitchen { display: block; width: 100%; aspect-ratio: 1440 / var(--scene-height, 672); border: 3px solid #793f30; border-radius: 18px 18px 0 0; background: #343838; }
.session-controls { display: flex; gap: 12px; align-items: center; }
#sound { font-size: 12px; padding: 7px 10px; }
#timer { color: var(--teal); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; font: bold 23px ui-monospace, monospace; }
#timer.urgent { background: #ffe0d2; color: #9c2520; }
body:is([data-screen="home"], [data-screen="results"]) #timer { display: none; }
button { border: 1px solid transparent; border-radius: 10px; background: var(--red); color: #fffaf0; padding: 11px 17px; font: inherit; font-weight: 800; cursor: pointer; }
button:hover { background: #9c2620; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
button:disabled { opacity: .6; cursor: default; }
.secondary, #pause { background: #e1efe4; color: #1e584e; border-color: #b5d4c5; }
.secondary:hover, #pause:hover { background: #c9e4d6; }
#pause { padding: 7px 12px; font-size: 12px; }
.text-button { display: inline-block; background: transparent; color: var(--teal); padding: 7px 10px; font-size: 13px; }
.text-button:hover { background: #e1efe4; }
.curtain { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: #37251dcc; border-radius: 18px 18px 0 0; }
.session-card { width: min(100%, 530px); max-height: 100%; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: 0 7px 0 #331a1744; text-align: center; }
.session-card h2 { margin: 0; font-size: clamp(22px, 3vw, 33px); line-height: 1.18; }
.session-card p { margin: 9px 0; line-height: 1.6; font-size: 14px; }
.session-card .hint { font-size: 12px; color: var(--muted); }
.card-actions { display: flex; justify-content: center; align-items: stretch; flex-wrap: wrap; gap: 9px; margin: 13px 0 6px; }
.name-label { display: block; font-size: 13px; font-weight: 800; margin: 14px 0 5px; text-align: left; }
.name-label span { color: var(--muted); font-size: 12px; font-weight: 500; margin-inline-start: .45em; }
.name-input { width: 100%; min-width: 0; border: 1px solid #c7a78d; border-radius: 8px; background: #fffcf6; color: var(--ink); padding: 9px 11px; font: inherit; font-size: 16px; }
.form-status { color: var(--teal); font-weight: 700; }
.form-status:empty, .hint:empty { display: none; }
.form-status.error { color: #992c23; }
body[data-screen="home"] { background: #43251a; }
body[data-screen="home"] main { width: 100%; max-width: none; }
body[data-screen="home"] header { position: absolute; top: 0; right: 0; z-index: 2; min-height: 0; padding: 13px clamp(12px, 3vw, 34px); }
body[data-screen="home"] header h1 { position: absolute; clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; white-space: nowrap; }
body[data-screen="home"] .brand { color: #392622; background: #fff8e8eb; border-radius: 4px; padding: 6px 7px; }
body[data-screen="home"] .curtain { position: relative; padding: 0; display: block; background: transparent; }
body[data-screen="home"] #kitchen, body[data-screen="home"] footer, body[data-screen="results"] footer { display: none; }
#welcome { position: relative; isolation: isolate; display: grid; width: 100%; min-height: 100svh; max-height: none; border: 0; border-radius: 0; box-shadow: none; padding: 0; overflow: hidden; color: #fff8e8; background: #43251a; }
.home-art { position: absolute; inset: 0; z-index: -2; }
.home-art img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: right center; }
#welcome::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, #fff4ddbd 0%, #fff4dd77 28%, #fff4dd00 44%); pointer-events: none; }
.welcome-copy { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 39%; padding: 52px clamp(14px, 3vw, 60px) 24px; gap: clamp(12px, 3svh, 36px); color: #42291f; }
#welcomeTitle { width: min(100%, 670px, 66svh); margin: 0; filter: drop-shadow(0 6px 5px #32170e40); }
#welcomeTitle img { display: block; width: 100%; height: auto; }
.home-menu { width: min(100%, 480px); }
#welcome .card-actions { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 0 0 9px; }
#welcome .home-action { position: relative; min-height: 49px; padding: 8px 14px; border: 2px solid #ffde98; outline: 1px solid #4c291a; outline-offset: 2px; border-radius: 14px 14px 10px 10px; box-shadow: inset 0 -4px #0002, 0 4px 0 #30180e; color: #fff4d5; font-size: clamp(14px, 2vw, 22px); font-weight: 900; }
#welcome .home-action::before, #welcome .home-action::after { content: ""; display: inline-block; width: 4px; height: 4px; vertical-align: middle; margin: 0 .45em; background: #ffd791; border-radius: 50%; }
#welcome #start { background: #a83329; }
#welcome #start:hover { background: #c34834; }
#welcome .nickname-row { border: 0; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 4px 0; font-size: clamp(17px, 1.35vw, 22px); font-weight: 800; }
#welcome .nickname-row b { font-size: clamp(14px, 1vw, 17px); }
#welcome .nickname-row b, #welcome .hint { color: #573426; }
#welcome .text-button { color: #fff2cf; background: #673c27; min-height: 34px; padding: 5px 12px; font-size: 14px; }
#welcome .text-button:hover { background: #855136; }
#welcome .hint, #welcome #homeStatus { margin: 4px 0 0; text-align: center; font-size: clamp(14px, 1.05vw, 17px); }
#welcome #homeBest { font-weight: 800; }
#welcome #homeStatus { color: #8f2c1d; }
.nickname-row { display: flex; align-items: center; justify-content: space-between; gap: 9px; padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.nickname-row span { min-width: 0; overflow-wrap: anywhere; }
.nickname-row b { color: var(--muted); font-size: 12px; margin-right: 8px; }
.nickname-row .text-button { flex-shrink: 0; }
#nameDialog { width: min(390px, calc(100% - 24px)); border: 1px solid var(--line); border-radius: 16px; background: var(--paper); color: var(--ink); padding: 23px; }
#nameDialog::backdrop { background: #32231bb0; }
#nameDialogTitle { margin: 0 0 12px; font-size: 20px; }
#nameDialog .card-actions { justify-content: flex-end; }
body[data-screen="results"] #kitchen { min-height: min(570px, 78svh); object-fit: cover; border-radius: 18px; }
body[data-screen="results"] .curtain { border-radius: 18px; }
#results { width: min(100%, 590px); border-top: 8px solid var(--red); }
#resultTitle { color: var(--red); }
#resultDishes { width: min(100%, 295px); height: auto; display: block; margin: 2px auto; }
.results-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; margin: 10px 0; }
.results-grid > div { padding: 8px 4px; border-radius: 10px; background: #f8e9ce; }
.results-grid > div:first-child { background: #ffe1ba; }
.results-grid dt { font-size: 12px; color: var(--muted); }
.results-grid dd { margin: 2px 0 0; font-size: clamp(20px, 3vw, 31px); font-weight: 900; color: var(--red); }
#comparison.best { color: #185849; font-weight: 850; }
















.console { position: relative; display: grid; grid-template-columns: minmax(94px, 1fr) 2fr minmax(77px, 1fr); align-items: center; gap: 8px; min-height: 121px; padding: 9px 20px; background: var(--paper); border: 2px solid #b36b51; border-top: 0; border-radius: 0 0 15px 15px; }
.order { margin: 4px 0 8px; font-size: clamp(13px, 2vw, 19px); }
.caption { color: var(--muted); font-size: 11px; font-weight: 800; }
#stage { color: var(--teal); font-size: 13px; }
.entry { position: relative; text-align: center; min-width: 0; }
#prompt { margin: 0; font-size: clamp(19px, 4vw, 40px); line-height: 1.1; }
#roman { margin-top: 3px; color: #775b51; font: bold clamp(13px, 2.5vw, 22px) ui-monospace, monospace; letter-spacing: .09em; overflow-wrap: anywhere; }
#typed { color: var(--teal); }
#next { color: var(--red); border-bottom: 2px solid var(--red); }
#key { width: min(220px, 100%); margin-top: 6px; padding: 4px 7px; border: 1px solid #c7a78d; border-radius: 5px; background: #fffcf6; color: var(--ink); text-align: center; }
#key:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
#key.bad { background: #ffe2d8; outline-color: var(--red); }
.count { text-align: right; white-space: nowrap; color: var(--red); }
#served { font: bold clamp(21px, 3.5vw, 34px) ui-monospace, monospace; }
footer { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; color: var(--muted); font-size: 12px; }
#status.trouble { color: var(--red); font-weight: 850; }
#stamp { position: absolute; right: 0; top: -28px; z-index: 1; padding: 3px 9px; color: var(--teal); border: 3px double currentColor; border-radius: 5px; background: var(--paper); font-weight: 900; transform: rotate(-8deg); pointer-events: none; }
body[data-screen="opening"] #timer { display: none; }
body[data-screen="opening"] .curtain { padding: 0; background: transparent; }
#opening { position: absolute; inset: 0; isolation: isolate; overflow: hidden; border-radius: inherit; }
@property --kitchen-reveal { syntax: "<percentage>"; inherits: false; initial-value: -24%; }
.opening-haze { position: absolute; inset: 0; background: #000; mask-image: radial-gradient(ellipse farthest-corner at 50% 50%, transparent var(--kitchen-reveal), #000 calc(var(--kitchen-reveal) + 20%)); animation: reveal-kitchen .84s cubic-bezier(.45,.05,.35,1) both; }
@keyframes reveal-kitchen {
  0%, 13% { --kitchen-reveal: -24%; }
  100% { --kitchen-reveal: 105%; }
}
.doorway { position: absolute; inset: 15% 22% 10%; perspective: 1000px; }
.doorway::before, .doorway::after { content: ""; position: absolute; top: 18%; bottom: -2%; width: 2.5%; z-index: -1; border: 1px solid #60351e; background: linear-gradient(90deg, #683a22, #b27649 45%, #855130); }
.doorway::before { right: 100%; }
.doorway::after { left: 100%; }
.door-leaf { position: absolute; inset: 0 auto 0 0; width: calc(50% - 1px); backface-visibility: hidden; animation: open-door .84s cubic-bezier(.5,.05,.22,1) both; }
.door-panel { display: block; width: 100%; height: 100%; object-fit: fill; }
.door-left { transform-origin: left; --swing: -102deg; }
.door-right { inset: 0 0 0 auto; transform-origin: right; --swing: 102deg; }
.door-right .door-panel { transform: scaleX(-1); }
@keyframes open-door { 0%, 13% { transform: rotateY(0); filter: brightness(.44); } 62% { filter: brightness(.85); } 100% { transform: rotateY(var(--swing)); filter: brightness(1); } }
#confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
#confetti i { position: absolute; top: 0; left: var(--x); width: 9px; height: 14px; background: var(--color); animation: fall 1.55s var(--delay) ease-in both; }
@keyframes fall { from { transform: translateY(-35px) rotate(0); } to { transform: translateY(72vh) rotate(400deg); opacity: 0; } }
@media (max-width: 760px) {
  main { width: calc(100% - 20px); }
  header { min-height: 49px; }
  .brand { font-size: 10px; }
  .session-controls { gap: 6px; }
  body:is([data-screen="game"], [data-screen="opening"]) .session-controls .brand { display: none; }
  #timer { font-size: 16px; padding: 4px 6px; }
  #welcome::before { background: linear-gradient(0deg, #fff4dd 0 19%, #fff4dd00 38% 67%, #fff4dd 87%); }
  .welcome-copy { width: 100%; justify-content: space-between; padding: 55px 16px 19px; }
  #welcomeTitle { width: min(62vw, 285px); }
  .home-art { background: #fff4dd; }
  .home-art img { object-fit: contain; object-position: center 48%; }
  #welcome .home-action { padding-inline: 5px; }
  .console { min-height: 88px; padding-inline: 7px; grid-template-columns: minmax(61px, 1fr) 2fr minmax(53px, .8fr); }
  #stage { font-size: 10px; }
  .curtain { padding: 8px; }
  .session-card { padding: 13px; }
  .session-card button { padding: 8px 10px; }


  body[data-screen="game"] .scene:has(#pauseCard:not([hidden])) #kitchen { min-height: 220px; object-fit: cover; }
}
@media (prefers-reduced-motion: reduce) {
  .door-leaf { animation: none; }
  #confetti { display: none; }
}
.console { position: sticky; bottom: 0; z-index: 2; }
</style>
</head>
<body data-screen="home">
<main>
  <header><h1>タイピングキッチン</h1><div class="session-controls"><span class="brand">KAIRI_STUDIO</span><button id="sound" type="button" class="secondary" aria-label="効果音" aria-pressed="true">音あり</button><span id="timer" aria-label="残り時間">2:00</span><button id="pause" type="button" hidden>一時停止</button></div></header>
  <div class="scene">
  <canvas id="kitchen" width="1440" height="672" aria-label="奥から仕込み、加熱、盛り付けの調理台が並ぶ厨房"></canvas>
  <div id="curtain" class="curtain">
    <section id="welcome" class="session-card" aria-labelledby="welcomeTitle">
      <div class="home-art"><img src="assets/diner-wide-home.webp" width="1774" height="887" fetchpriority="high" alt="洋食店のコックたちと、オムライスを受け取るウェイター"></div>
      <div class="welcome-copy">
        <h2 id="welcomeTitle"><img src="assets/diner-title-logo.webp" width="780" height="520" alt="タイピングキッチン"></h2>
        <div class="home-menu">
          <div class="card-actions">
            <button id="start" class="home-action" type="button" disabled>厨房を準備しています…</button>
          </div>
          <div class="nickname-row"><span><b>なまえ</b><span id="homeName">未設定</span></span><button id="editHomeName" class="text-button" type="button" aria-label="なまえを変更">変更</button></div>
          <p id="homeStatus" class="form-status" role="status"></p>
          <p id="homeBest" class="hint"></p>
          <p class="hint">PCの半角英字キーでプレイ</p>
        </div>
      </div>
    </section>
    <div id="opening" aria-hidden="true" hidden><div class="opening-haze"></div><div class="doorway"><div class="door-leaf door-left"><img class="door-panel" src="assets/diner-swing-door.webp" alt=""></div><div class="door-leaf door-right"><img class="door-panel" src="assets/diner-swing-door.webp" alt=""></div></div></div>
    <section id="pauseCard" class="session-card" aria-labelledby="pauseTitle" hidden>
      <h2 id="pauseTitle">ひと休み</h2><p>準備ができたら営業を再開しよう。</p>
      <button id="resume" type="button">営業を再開</button>
      <button id="quit" type="button" class="text-button">営業を終えてホームへ</button>
    </section>
    <section id="results" class="session-card" aria-labelledby="resultTitle" hidden>
      <h2 id="resultTitle">本日の営業終了</h2>
      <canvas id="resultDishes" width="500" height="74" aria-hidden="true" hidden></canvas>
      <dl class="results-grid">
        <div><dt>お届けした料理</dt><dd id="resultServed">0皿</dd></div>
        <div><dt>正確さ</dt><dd id="resultAccuracy">—</dd></div>
        <div><dt>打ち間違い</dt><dd id="resultMisses">0回</dd></div>
      </dl>
      <p id="comparison"></p>
      <div class="card-actions"><button id="retry" type="button">もう一度あそぶ</button></div>
      <button id="homeFromResult" type="button" class="text-button">ホームへ</button>
    </section>
    <div id="confetti" aria-hidden="true"></div>
  </div></div>
  <section id="typingConsole" class="console" hidden aria-label="タイピング">
    <div><div class="caption">注文</div><h2 class="order" id="order"></h2><strong id="stage"></strong></div>
    <div class="entry"><span id="stamp" aria-hidden="true" hidden>OK!</span><h2 id="prompt"></h2><div id="roman" aria-hidden="true"><span id="typed"></span><span id="next"></span><span id="rest"></span></div>
      <input id="key" aria-label="ローマ字入力欄" placeholder="半角英字で入力" autocomplete="off" spellcheck="false" inputmode="none" disabled>
    </div>
    <div class="count"><div class="caption">提供済み</div><strong id="served">00</strong> 皿</div>
  </section>
  <footer><span id="status" role="status">厨房を準備しています…</span><span>PCの英数キーで入力</span></footer>
</main>
<dialog id="nameDialog" aria-labelledby="nameDialogTitle">
  <form id="nameForm">
    <h2 id="nameDialogTitle">なまえを変更</h2>
    <label class="name-label" for="playerName">ニックネーム（8文字まで）</label>
    <input id="playerName" class="name-input" type="text" autocomplete="off" spellcheck="false" maxlength="16" autofocus>
    <p id="nameStatus" class="form-status error" role="status"></p>
    <div class="card-actions"><button id="cancelName" type="button" class="secondary">キャンセル</button><button type="submit">保存</button></div>
  </form>
</dialog>
<script src="game.js?v=two-minute-home"></script>
</body>
</html>
