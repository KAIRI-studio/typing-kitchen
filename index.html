<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイピングキッチン | KAIRI_studio</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; --gold: #edbf84; --soft: #b4b9b6; }
body { margin: 0; background: #171a1b; color: #f1ebe0; font-family: "Yu Gothic UI", Meiryo, sans-serif; }
main { width: min(calc(100% - 48px), 1320px, calc((100svh - 235px) * 2.4)); min-width: 720px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: baseline; padding: 15px 0 11px; }
h1 { font-size: 20px; margin: 0; }
.brand { color: var(--soft); font: 12px ui-monospace, monospace; letter-spacing: .13em; }
canvas { display: block; width: 100%; aspect-ratio: 12 / 5; border: 1px solid #515654; border-radius: 7px 7px 0 0; background: #343838; }
.console { display: grid; grid-template-columns: minmax(158px, 1fr) 2fr minmax(110px, 1fr); align-items: center; gap: 12px; min-height: 128px; padding: 10px 24px; background: #232729; border: 1px solid #515654; border-top: 0; border-radius: 0 0 7px 7px; }
.order { margin: 3px 0 10px; font-size: 17px; }
.caption { color: var(--soft); font-size: 11px; font-weight: bold; letter-spacing: .1em; }
#stage, #served, #typed { color: var(--gold); }
.entry { text-align: center; }
#prompt { margin: 0; font-size: clamp(28px, 3.6vw, 42px); line-height: 1.2; }
#roman { font: bold 20px ui-monospace, monospace; letter-spacing: .14em; color: var(--soft); min-height: 25px; }
#next { color: white; border-bottom: 2px solid var(--gold); }
#key { width: min(220px, 100%); margin-top: 6px; padding: 4px 8px; border: 1px solid #626966; border-radius: 4px; background: #191c1d; color: white; text-align: center; }
#key:focus { outline: 1px solid #b69972; }
#key.bad { background: #592f2d; outline-color: #e38676; }
.count { text-align: right; white-space: nowrap; }
#served { font: bold 27px ui-monospace, monospace; }
footer { display: flex; justify-content: space-between; padding: 8px 0; color: var(--soft); font-size: 12px; }
@media (max-width: 760px) {
  main { min-width: 0; width: calc(100% - 20px); }
  header { padding-block: 9px; }
  h1 { font-size: 15px; }
  .brand, .caption, footer { font-size: 10px; }
  .console { grid-template-columns: minmax(70px, 1fr) 1.7fr minmax(54px, .75fr); min-height: 88px; gap: 6px; padding: 8px; }
  .order { font-size: 12px; }
  #stage, .count { font-size: 11px; }
  #served, #roman { font-size: 16px; }
  #prompt { font-size: clamp(18px, 5vw, 30px); }
}
</style>
</head>
<body>
<main>
  <header><h1>タイピングキッチン</h1><span class="brand">KAIRI_STUDIO</span></header>
  <canvas id="kitchen" width="1440" height="600" aria-label="奥から仕込み、加熱、盛り付けの調理台が並ぶ厨房"></canvas>
  <section class="console" aria-label="タイピング">
    <div><div class="caption">注文</div><h2 class="order" id="order"></h2><strong id="stage"></strong></div>
    <div class="entry"><h2 id="prompt"></h2><div id="roman" aria-hidden="true"><span id="typed"></span><span id="next"></span><span id="rest"></span></div>
      <input id="key" aria-label="ローマ字入力欄" placeholder="半角英字で入力" autocomplete="off" spellcheck="false" inputmode="none" autofocus>
    </div>
    <div class="count"><div class="caption">提供済み</div><strong id="served">00</strong> 皿</div>
  </section>
  <footer><span id="status" role="status">厨房を準備しています…</span><span>PCの英数キーで入力</span></footer>
</main>
<script src="game.js?v=illustrated"></script>
</body>
</html>
